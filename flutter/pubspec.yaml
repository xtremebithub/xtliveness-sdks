name: xtliveness
description: Face liveness check for Flutter apps on Android, iOS and the web. Runs the hosted check with the camera and reports when the person is done.
version: 1.1.1
homepage: https://liveness.xtremebithub.com
repository: https://github.com/xtremebithub/xtliveness-sdks/tree/main/flutter
issue_tracker: https://github.com/xtremebithub/xtliveness-sdks/issues
documentation: https://liveness.xtremebithub.com/console/
topics:
  - liveness
  - face-recognition
  - identity-verification
  - kyc
  - camera

platforms:
  android:
  ios:
  web:

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  webview_flutter_wkwebview: ^3.16.0
  permission_handler: ^11.3.1
  flutter_tts: ^4.2.0
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
